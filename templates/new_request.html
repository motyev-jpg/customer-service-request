{% extends "base.html" %}
{% block content %}
<section class="card narrow">
  <h1>{{ t('new_request') }}</h1>
  {% if error %}<div class="error">{{ t(error) }}</div>{% endif %}
  <form method="post" action="{{ url_for('new_request') }}">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">

    <label for="category">{{ t('category') }}</label>
    <select id="category" name="category" required>
      <option value="">{{ t('select_category') }}</option>
      {% for c in categories %}
      <option value="{{ c.id }}" {{ 'selected' if c.id == form.category }}>{{ localized(c) }}</option>
      {% endfor %}
    </select>

    <label for="subcategory">{{ t('subcategory') }}</label>
    <select id="subcategory" name="subcategory" required data-selected="{{ form.subcategory }}"
            data-placeholder="{{ t('select_subcategory') }}">
      <option value="">{{ t('select_subcategory') }}</option>
    </select>

    <label for="description">{{ t('description_optional') }}</label>
    <textarea id="description" name="description" rows="6"
              maxlength="{{ max_len }}">{{ form.description }}</textarea>

    <div class="form-actions">
      <button type="submit" class="btn">{{ t('submit') }}</button>
      <a class="btn btn-secondary" href="{{ url_for('dashboard') }}">{{ t('cancel') }}</a>
    </div>
  </form>
</section>
<script id="categories-data" type="application/json">{{ categories | tojson }}</script>
<script id="lang-data" type="application/json">{{ lang | tojson }}</script>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/new_request.js') }}"></script>
{% endblock %}
